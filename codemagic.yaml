workflows:
  stikdebug-ios:
    name: Build Unsigned StikDebug IPA (Final Diagnostic Build)
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: "com.ahmed.stikdebug"
        APP_NAME: "StikDebug"
    scripts:
      - name: Archive and Package Unsigned IPA
        script: |
          set -ex

          export ARCHIVE_PATH="$HOME/build/$APP_NAME.xcarchive"
          export IPA_PATH="$CM_BUILD_DIR/$APP_NAME.ipa"
          export APP_BUNDLE="$ARCHIVE_PATH/Products/Applications/$APP_NAME.app"

          echo "== Archiving with xcodebuild at $(date) =="
          xcodebuild \
            -workspace "$APP_NAME.xcworkspace" \
            -scheme "$APP_NAME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            ONLY_ACTIVE_ARCH=NO \
            archive | tee xcodebuild.log

          echo "== Verifying archive contents =="
          if [ ! -d "$APP_BUNDLE" ]; then
            echo "❌ .app not found inside archive"
            exit 1
          fi

          echo "== Verifying executable inside .app =="
          if [ ! -f "$APP_BUNDLE/$APP_NAME" ]; then
            echo "❌ Executable $APP_NAME not found inside .app bundle"
            ls -l "$APP_BUNDLE"
            exit 1
          fi

          echo "== Creating Payload directory =="
          mkdir -p Payload
          cp -r "$APP_BUNDLE" Payload/ || {
            echo "❌ Failed to copy .app to Payload"
            exit 1
          }

          echo "== Zipping into IPA file =="
          zip -r "$APP_NAME.ipa" Payload
          mv "$APP_NAME.ipa" "$CM_BUILD_DIR/" || {
            echo "❌ Failed to move IPA"
            exit 1
          }

          echo "== Cleaning up Payload =="
          rm -rf Payload

          echo "== Checking final IPA size =="
          IPA_SIZE_KB=$(du -k "$IPA_PATH" | cut -f1)
          echo "📦 IPA size: ${IPA_SIZE_KB} KB"
          if [ "$IPA_SIZE_KB" -lt 1000 ]; then
            echo "❌ IPA size too small — likely incomplete content"
            exit 1
          fi

          echo "✅ Build and verification completed at $(date)"

    artifacts:
      - "*.ipa"
      - "xcodebuild.log"
      - "$HOME/build/$APP_NAME.xcarchive/**/*"
      - "$HOME/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog"
