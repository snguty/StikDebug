workflows:
  stikdebug-ios:
    name: Build Unsigned StikDebug IPA
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: "com.ahmed.stikdebug"
        APP_NAME: "StikDebug"
    scripts:
      - name: Build IPA (unsigned)
        script: |
          set -ex
          xcodebuild \
            -workspace StikDebug.xcworkspace \
            -scheme StikDebug \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $HOME/build/StikDebug.xcarchive \
            archive | tee xcodebuild.log

          echo "== Check archive output =="
          ls -la $HOME/build/StikDebug.xcarchive/Products/Applications || echo "❌ App not found."

          mkdir -p Payload
          cp -r $HOME/build/StikDebug.xcarchive/Products/Applications/*.app Payload/ || echo "❌ Copy .app failed"
          zip -r "$APP_NAME.ipa" Payload || echo "❌ Zipping IPA failed"
          mv "$APP_NAME.ipa" $CM_BUILD_DIR/

    artifacts:
      - "*.ipa"
      - "xcodebuild.log"
      - "$HOME/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog"
