workflows:
  stikdebug-ios:
    name: Build StikDebug for iOS 16.7.11
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: "com.example.stikdebug"
        APP_NAME: "StikDebug"
      ios_signing:
        distribution_type: development
        bundle_identifier: $BUNDLE_ID
    scripts:
      - name: Clean previous build
        script: |
          set -ex
          xcodebuild clean -workspace StikDebug.xcworkspace -scheme StikDebug

      - name: Build and export IPA
        script: |
          set -ex
          xcodebuild \
            -workspace StikDebug.xcworkspace \
            -scheme StikDebug \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $HOME/build/StikDebug.xcarchive \
            archive

          xcodebuild -exportArchive \
            -archivePath $HOME/build/StikDebug.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $HOME/build/IPA

    artifacts:
      - build/IPA/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog
      - ExportOptions.plist
